<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>智能搜索助手 — 封面</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:#f7f5f0;}
  svg{display:block;}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="cover-title cover-desc">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>

      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>

    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f7f5f0"/>

  <line x1="664" y1="96" x2="664" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>

  <text x="108" y="94" fill="#4f5d75" font-size="16" font-family="'Geist Mono', monospace"

  <text x="80" y="216" fill="#2d3142" font-size="64" font-weight="700"

  <text x="80" y="276" fill="#4f5d75" font-size="24" font-weight="500"

    <rect x="160" y="428" width="100" height="32" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>

    <text x="408" y="492">Docker</text>

  <line x1="824" y1="284" x2="852" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="956" y="380" fill="#4f5d75" font-size="12" font-family="'Geist Mono',monospace"

  <rect x="704" y="252" width="120" height="64" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="764" y="280" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle"

  <rect x="856" y="252" width="168" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="940" y="280" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle"
        font-family="'Geist',sans-serif">ReAct Agent</text>
  <text x="940" y="302" fill="#4f5d75" font-size="12" text-anchor="middle"

    <rect x="988" y="472" width="56" height="32" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>

    <rect x="1060" y="472" width="56" height="32" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
