# ============================================================
# 智能搜索助手 — Docker Compose 编排
# 后端 (FastAPI) + 前端 (Next.js) + Redis (支持向量) + 监控
# 通过内部网络通信，支持 95% SLA 可用性监控
# ============================================================

name: search-agent

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile          # ★ 修：Dockerfile.backend 不存在
    container_name: search-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env                          # ★ .env 里要加 DEEPSEEK_API_KEY 等
    environment:
      - PYTHONUNBUFFERED=1
      # ★ 新增：连接 Docker 网络内的 Redis Stack
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 容器内连宿主机 TencentDB-Agent-Memory Gateway
      - TDAI_GATEWAY_URL=http://host.docker.internal:8420
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kb_data:/app/data             # 知识库/图谱/会话 JSONL 持久化
      - ./providers.yaml:/app/providers.yaml:ro   # ★ 新增：Provider 配置挂载（只读）
    networks:
      - search-network
    depends_on:
      - redis                         # ★ 新增：等待 Redis 启动
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend             # ★ 修：前端项目在 frontend/ 子目录
      dockerfile: Dockerfile          # ★ 修：Dockerfile.frontend 不存在
    container_name: search-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    networks:
      - search-network
    depends_on:
      backend:
        condition: service_healthy

  # ============================================================
  # Redis Stack — 提供 L1 缓存 + L2 向量检索 (RediSearch)
  # ============================================================
  redis:
    image: redis/redis-stack-server:7.2.0-v10   # ★ 必须使用带有 Search 模块的镜像
    container_name: search-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      # 设定 Redis 启动参数：开启 AOF 持久化，限制最大内存并设置 LRU 淘汰策略
      - REDIS_ARGS=--appendonly yes --maxmemory 400mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - search-network

  # ============================================================
  # Prometheus — 指标抓取与存储
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: search-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - search-network
    depends_on:
      backend:
        condition: service_healthy

  # ============================================================
  # Grafana — 可视化面板 (登录: admin / admin)
  # ============================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: search-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - search-network
    depends_on:
      - prometheus

networks:
  search-network:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  kb_data:
    driver: local
  redis_data:                         # ★ 新增：Redis 持久化数据卷
    driver: local