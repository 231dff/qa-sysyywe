apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-sysyywe
  namespace: agent-platform
  labels:
    app: qa-sysyywe
spec:
  replicas: 1                          # ★ 改回 1 副本，避免本地内存被模型撑爆
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: qa-sysyywe
  template:
    metadata:
      labels:
        app: qa-sysyywe
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: qa-sysyywe
          image: qa-sysyywe:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: qa-sysyywe-config
            - secretRef:
                name: qa-sysyywe-secret
          env:
            - name: PYTHONIOENCODING
              value: "utf-8"
            - name: PYTHONUTF8
              value: "1"
            - name: LANG
              value: "C.UTF-8"
            - name: LC_ALL
              value: "C.UTF-8"
            - name: SESSION_BACKEND
              value: "redis"
            - name: REDIS_HOST
              value: "redis.agent-platform.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: HF_ENDPOINT
              value: "https://hf-mirror.com"  # 确保模型下载走国内镜像
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "6Gi"                   # ★ 提升到 6Gi，防止模型加载时 OOMKilled
          
          # ★ 新增：启动探针。允许模型下载/加载最长 5 分钟（30 * 10s）
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
            
          # 存活探针：startupProbe 成功后才开始生效
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
            
          # 就绪探针：startupProbe 成功后才开始生效
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qa-sysyywe
  namespace: agent-platform
spec:
  type: ClusterIP
  selector:
    app: qa-sysyywe
  ports:
    - name: http
      port: 8000
      targetPort: 8000