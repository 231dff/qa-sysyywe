apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-sysyywe
  namespace: agent-platform
  labels:
    app: qa-sysyywe
spec:
  replicas: 3                          # ← 改：单副本 → 3 副本
  strategy:
    type: RollingUpdate                # ← 改：Recreate → RollingUpdate
    rollingUpdate:
      maxSurge: 1                      # 更新时最多多起 1 个 Pod
      maxUnavailable: 0                # 更新时保证 0 个 Pod 不可用
  selector:
    matchLabels:
      app: qa-sysyywe
  template:
    metadata:
      labels:
        app: qa-sysyywe
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: qa-sysyywe
          image: qa-sysyywe:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: qa-sysyywe-config
            - secretRef:
                name: qa-sysyywe-secret
          env:
            - name: PYTHONIOENCODING
              value: "utf-8"
            - name: PYTHONUTF8
              value: "1"
            - name: LANG
              value: "C.UTF-8"
            - name: LC_ALL
              value: "C.UTF-8"
            - name: SESSION_BACKEND
              value: "redis"
            - name: REDIS_HOST
              value: "redis.agent-platform.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
              # ── Langfuse 链路追踪 ──
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: qa-sysyywe-secret
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: qa-sysyywe-secret
                  key: LANGFUSE_SECRET_KEY
            - name: LANGFUSE_HOST
              value: "https://cloud.langfuse.com"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}                 # ← 改：PVC → emptyDir（多副本兼容）
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qa-sysyywe
  namespace: agent-platform
spec:
  type: ClusterIP
  selector:
    app: qa-sysyywe
  ports:
    - name: http
      port: 8000
      targetPort: 8000