name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  quick-checks:
    name: 快速确定性检查（5 套件 + 覆盖率）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 使用 uv 安装依赖
        run: |
          python -m pip install uv
          uv pip install --system -r requirements.txt

      - name: 确定性套件
        # ✅ 修复：去掉了 --no-color，因为 python -m evals 没这个参数
        run: |
          python -m evals \
            --kind offline_regression \
            --kind fault_injection \
            --kind security_audit \
            --kind quality \
            --kind memory

      - name: 覆盖率报告
        run: |
          python -m pytest --cov=agent --cov=rag --cov=memory --cov=tools --cov=utils --cov=config \
            --cov-report=term-missing --cov-fail-under=70

  e2e-gate:
    name: E2E 评测 + 门禁对比
    runs-on: ubuntu-latest
    needs: quick-checks
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 使用 uv 安装依赖
        run: |
          python -m pip install uv
          uv pip install --system -r requirements.txt

      - name: 启动后端
        env:
          LLM_API_KEY: ${{ secrets.AGENT_API_KEY }}
          LLM_API_BASE: ${{ secrets.AGENT_API_BASE }}
          LLM_MODEL: qwen-turbo
          SESSION_BACKEND: redis
        run: |
          docker compose up -d backend redis
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
              echo "backend ready after ${i}x3s"
              break
            fi
            sleep 3
          done
          curl -sf http://127.0.0.1:8000/api/health || (docker compose logs backend && exit 1)

      - name: 跑黄金集 E2E
        env:
          EVAL_BACKEND_URL: http://127.0.0.1:8000
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_API_BASE: ${{ secrets.AGENT_API_BASE }}
          AGENT_MODEL: qwen-turbo
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_BASE_URL: ${{ secrets.JUDGE_BASE_URL }}
          JUDGE_MODEL: qwen-max
          EVAL_CONCURRENCY: "3"
        run: python -m evals --kind golden_e2e --concurrency 3

      - name: 门禁对比基线
        # ✅ gate.py 是支持 --no-color 的，所以这里保留没问题
        run: |
          python -m evals.gate \
            --no-color \
            --output-json evals/reports/gate_result.json

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ github.run_id }}
          path: |
            evals/reports/eval_report.csv
            evals/reports/gate_result.json
            evals/reports/baseline/baseline_report.csv
          retention-days: 14

      - name: 清理
        if: always()
        run: docker compose down -v

  frontend-checks:
    name: 前端类型检查 + Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: ESLint
        run: npm run lint